<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprintline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <!--
      Pre-paint theme resolution. Runs before first paint so there is no
      light-flash when the stored/system preference is dark. `data-theme` is
      always a concrete "light" | "dark" — the "system" preference is resolved
      here and re-resolved at runtime by ThemeProvider.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sprintline-theme')
          var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <style>
      /* First-paint background so the shell never flashes the wrong colour. */
      html {
        background: #f1f1f3;
        color: #18181b;
        color-scheme: light;
      }
      html[data-theme='dark'] {
        background: #0b0c0f;
        color: #e8eaed;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
